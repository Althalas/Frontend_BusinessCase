<mat-card class="station-card" data-cy="station-card">
  <div class="station-image-placeholder" [class.has-photo]="station().photos?.length">
    @if (station().photos?.length) {
      <img [src]="station().photos![0]" alt="Photo de la borne" class="station-photo" />
    } @else {
      <mat-icon>ev_station</mat-icon>
    }
    <button mat-icon-button class="favorite-btn" [class.is-favorite]="isFavorite()" (click)="onToggleFavorite($event)"
      aria-label="Ajouter aux favoris">
      <mat-icon>{{ isFavorite() ? "favorite" : "favorite_border" }}</mat-icon>
    </button>
  </div>

  <mat-card-content>
    <div class="d-flex justify-content-between align-items-center mb-2">
      <p class="text-sm text-gray-700">{{ station().powerKw }} kW • {{ station().connectorType }}</p>
      <app-status-badge [station]="station()"></app-status-badge>
    </div>
    <p class="station-address">
      <mat-icon>location_on</mat-icon>
      {{ address() }}
    </p>

    <div class="station-specs">
      <mat-chip-set>
        <mat-chip>
          <mat-icon>power</mat-icon>
          {{ power() | number : "1.1-1" }} kW
        </mat-chip>
      </mat-chip-set>
    </div>

    <div class="station-footer">
      <div class="price">
        <span class="price-value">{{ price() | number : "1.2-2" }} €</span>
        <span class="price-unit">/h</span>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" [routerLink]="['/stations', station().id]" data-cy="station-detail-btn">
      Voir détails
    </button>
    @if (!isAdmin()) {
    <button mat-raised-button color="accent" [routerLink]="['/bookings/new', station().id]" data-cy="station-book-btn">
      Réserver
    </button>
    }
  </mat-card-actions>
</mat-card>
