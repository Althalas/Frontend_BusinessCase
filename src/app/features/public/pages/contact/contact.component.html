
<div class="page-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Contactez-nous</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="contact-layout">
        <div class="contact-info">
          <h3>Besoin d'aide ?</h3>
          <p>
            Notre équipe est là pour répondre à toutes vos questions
            concernant l'utilisation de la plateforme.
          </p>

          <div class="info-item">
            <mat-icon>email</mat-icon>
            <span>support&#64;electricity-business.com</span>
          </div>
          <div class="info-item">
            <mat-icon>phone</mat-icon>
            <span>+33 1 23 45 67 89</span>
          </div>
          <div class="info-item">
            <mat-icon>location_on</mat-icon>
            <span>Paris, France</span>
          </div>
        </div>

        <form
          [formGroup]="contactForm"
          (ngSubmit)="onSubmit()"
          class="contact-form"
        >
          <mat-form-field appearance="outline">
            <mat-label>Nom complet</mat-label>
            <input
              matInput
              formControlName="name"
              placeholder="Votre nom"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input
              matInput
              formControlName="email"
              placeholder="votre@email.com"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Sujet</mat-label>
            <input
              matInput
              formControlName="subject"
              placeholder="Sujet de votre message"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Message</mat-label>
            <textarea
              matInput
              formControlName="message"
              rows="5"
              placeholder="Comment pouvons-nous vous aider ?"
            ></textarea>
          </mat-form-field>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="contactForm.invalid || isSending()"
          >
            <mat-icon>send</mat-icon> Envoyer le message
          </button>
        </form>
      </div>
    </mat-card-content>
  </mat-card>
</div>
