
<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Motif / Raison</mat-label>
    <textarea
      matInput
      [(ngModel)]="reason"
      rows="3"
      [required]="data.required ?? true"
    ></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">
    {{ data.cancelLabel || "Annuler" }}
  </button>
  <button
    mat-flat-button
    color="warn"
    [disabled]="(data.required ?? true) && !reason"
    (click)="onConfirm()"
  >
    {{ data.confirmLabel || "Confirmer" }}
  </button>
</mat-dialog-actions>
