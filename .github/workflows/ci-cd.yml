name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ========================
  # Unit Testing & Linting
  # ========================
  test-unit:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Generate environment files
        run: node set-env.js
        env:
          NG_APP_API_URL_DEV: "http://localhost:3000/api"
          STRIPE_PUBLIC_KEY_DEV: "pk_test_mock_key"

      - name: Run unit tests
        run: npm run test:ci -- --coverage

      - name: Build application
        run: npm run build -- --configuration production

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  # ========================
  # Code Quality Analysis
  # ========================
  sonarcloud:
    name: SonarCloud Scan
    needs: [test-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ========================
  # E2E Testing (Cypress)
  # ========================
  test-e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: electricity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Backend Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/electricity-backend:latest

      - name: Start Backend Container
        run: |
          docker run -d \
            --name backend \
            --network host \
            -e DATABASE_URL='postgresql://test:test@localhost:5432/electricity_test' \
            -e JWT_SECRET=test_secret_key_for_ci \
            -e JWT_REFRESH_SECRET=test_refresh_secret_key_for_ci \
            -e STRIPE_SECRET_KEY=sk_test_mock_key_12345 \
            -e STRIPE_WEBHOOK_SECRET=whsec_mock_secret_12345 \
            -e PORT=3000 \
            -e NODE_ENV=test \
            -e THROTTLE_LIMIT=10000 \
            -e THROTTLE_TTL=60000 \
            ${{ secrets.DOCKER_USERNAME }}/electricity-backend:latest

      - name: Wait for Backend Container to be ready
        run: |
          echo "Waiting for backend container to start..."
          sleep 15
          docker logs backend

      - name: Initialize Database Schema
        run: |
          echo "Pushing Prisma schema to database..."
          docker exec backend npx prisma db push --skip-generate
          echo "Database schema pushed successfully."

      - name: Seed Database
        run: |
          echo "Compiling seed script..."
          docker exec backend npx tsc prisma/seed.ts --skipLibCheck --target es2020 --module commonjs --outDir prisma/
          echo "Running seed script..."
          docker exec backend node prisma/seed.js
          echo "Database seeded successfully."

      - name: Verify Backend Health
        run: |
          echo "Checking backend health..."
          curl -f http://localhost:3000/api/docs || (docker logs backend && exit 1)
          echo "Backend is healthy."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Start Frontend Server
        run: |
          npm start &
          echo "Frontend starting in background..."
        env:
          STRIPE_PUBLIC_KEY_DEV: pk_test_mock_key
          NG_APP_API_URL_DEV: http://localhost:3000/api

      - name: Wait for Frontend to be ready
        run: |
          echo "Waiting for frontend..."
          npx wait-on http://localhost:4200 --timeout 120000
          echo "Frontend is ready."

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: ./
          command: npx cypress run --browser chrome
        env:
          CYPRESS_baseUrl: http://localhost:4200
          CYPRESS_apiUrl: http://localhost:3000/api

      - name: Upload Cypress Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Cypress Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

      - name: Show Backend Logs on Failure
        if: failure()
        run: docker logs backend
