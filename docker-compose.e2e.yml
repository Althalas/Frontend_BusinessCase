# Docker Compose for E2E Testing (Cypress)
# Usage: docker compose -f docker-compose.e2e.yml up -d
# Then run: cd Frontend_BusinessCase && npm run e2e:headless

services:
  # PostgreSQL Test Database
  test-db:
    image: postgres:17-alpine
    container_name: electricity_test_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: electricity_test
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d electricity_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  # Backend API (NestJS) with DB setup
  backend:
    build:
      context: ./Backend_BusinessCase
      dockerfile: Dockerfile
    container_name: electricity_backend_e2e
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://test:test@test-db:5432/electricity_test?schema=public
      - JWT_SECRET=e2e_test_jwt_secret_key_12345
      - JWT_REFRESH_SECRET=e2e_test_refresh_secret_key_12345
      - JWT_EXPIRATION=1d
      - PORT=3000
      - MAIL_HOST=localhost
      - MAIL_PORT=1025
      - MAIL_USER=test
      - MAIL_PASSWORD=test
      - MAIL_FROM=noreply@test.com
      - STRIPE_SECRET_KEY=sk_test_mock_key_12345
      - STRIPE_WEBHOOK_SECRET=whsec_mock_secret_12345
      - FRONTEND_URL=http://localhost:4200
    depends_on:
      test-db:
        condition: service_healthy
    # Run migrations, seed, then start
    command: >
      sh -c "
        echo 'Pushing Prisma schema...' &&
        npx prisma db push --skip-generate &&
        echo 'Seeding database...' &&
        npx prisma db seed &&
        echo 'Starting server...' &&
        node dist/main.js
      "
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/docs || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # Frontend (Angular)
  frontend:
    build:
      context: ./Frontend_BusinessCase
      dockerfile: Dockerfile.dev
    container_name: electricity_frontend_e2e
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - STRIPE_PUBLIC_KEY_DEV=pk_test_mock_key
      - STRIPE_PUBLIC_KEY_DOCKER=pk_test_mock_key
      - NG_APP_API_URL_DOCKER=http://backend:3000/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    volumes:
      - ./Frontend_BusinessCase:/app
      - /app/node_modules

  cypress:
    image: cypress/included:13.17.0
    container_name: electricity_cypress
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      - CYPRESS_baseUrl=http://frontend:4200
      - CYPRESS_apiUrl=http://backend:3000/api
    volumes:
      - ./Frontend_BusinessCase:/e2e
    working_dir: /e2e
    # Entrypoint of the image usually handles "cypress run", we just need to ensure arguments
    command: [ "--browser", "electron" ]
volumes:
  postgres_test_data:
